<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타짱 프리미어</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, :after, :before { box-sizing: border-box; }
    body { margin: 0; background: #0f0f0f; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: #141414; }
    .drag-over { border: 2px dashed #facc15 !important; transform: scale(0.96); }
  </style>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const MAX_IMAGES = 60;

    function TazzangPremier() {
      // 레이아웃 & 패널
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [sidebarWidth, setSidebarWidth] = useState(380);
      const [isResizing, setIsResizing] = useState(false);
      const [isVertical, setIsVertical] = useState(false); // 16:9 vs 9:16
      const canvasW = isVertical ? 720 : 1280;
      const canvasH = isVertical ? 1280 : 720;

      // 트랙 미디어 상태
      const [images, setImages] = useState([
        { id: "img1", name: "Sample 1", url: "", duration: 5 },
        { id: "img2", name: "Sample 2", url: "", duration: 5 },
      ]);
      const [pipMedia, setPipMedia] = useState(null); // PIP 미디어 (동영상 또는 이미지)
      const [audio, setAudio] = useState(null);       // 배경 mp3

      // 재생 제어
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const currentTimeRef = useRef(0);
      useEffect(() => { currentTimeRef.current = currentTime; }, [currentTime]);

      // 이미지 시간 배분 모드: 'fit'(오디오 전체 균등 배분) vs 'loop'(지정 초 무한 반복)
      const [durationMode, setDurationMode] = useState("fit");
      const [fixedPerSec, setFixedPerSec] = useState(5.0);

      // 효과 설정
      const [kenBurns, setKenBurns] = useState(true);
      const [bgBlur, setBgBlur] = useState(true);

      // PIP 설정 및 스왑(Swap)
      const [showPip, setShowPip] = useState(true);
      const [pipLoop, setPipLoop] = useState(true);
      const [pipStart, setPipStart] = useState(0);
      const [pipEnd, setPipEnd] = useState(60);
      const [pipSize, setPipSize] = useState(25);
      const [pipPos, setPipPos] = useState("우하단");
      const [freePos, setFreePos] = useState(null);
      const [isSwapped, setIsSwapped] = useState(false); // 더블클릭 시 메인과 PIP 화면 맞교환

      const [audioVol, setAudioVol] = useState(0.8);
      const [toastMsg, setToastMsg] = useState("");
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(""), 3000); };

      // DOM & 캐시 Refs
      const canvasRef = useRef(null);
      const pipVideoRef = useRef(null);
      const audioRef = useRef(null);
      const imgCache = useRef(new Map());
      const dragItemIdx = useRef(null);

      // 총 영상 길이 계산 (오디오가 있으면 오디오 기준, 없으면 이미지 합산)
      const totalDuration = useMemo(() => {
        if (audio && audio.duration > 0) return audio.duration;
        if (durationMode === "loop") return images.length * fixedPerSec || 30;
        return images.reduce((acc, cur) => acc + (cur.duration || 5), 0) || 30;
      }, [audio, images, durationMode, fixedPerSec]);

      // 오디오/이미지 변동 시 각 장당 재생시간 자동 계산
      useEffect(() => {
        if (images.length === 0) return;
        if (durationMode === "fit") {
          const autoDuration = totalDuration / images.length;
          setImages(prev => prev.map(img => ({ ...img, duration: autoDuration })));
        } else {
          setImages(prev => prev.map(img => ({ ...img, duration: fixedPerSec })));
        }
      }, [durationMode, fixedPerSec, totalDuration, images.length]);

      // PIP 종료 시간 자동 동기화
      useEffect(() => {
        if (pipEnd > totalDuration || pipEnd <= 0) setPipEnd(totalDuration);
      }, [totalDuration]);

      // 이미지 프리로딩
      useEffect(() => {
        images.forEach(img => {
          if (img.url && !imgCache.current.has(img.url)) {
            const i = new Image();
            i.src = img.url;
            i.onload = () => imgCache.current.set(img.url, i);
            imgCache.current.set(img.url, i);
          }
        });
      }, [images]);

      // 현재 시간에 활성화된 이미지 계산 (무한루프 지원)
      const currentActiveImage = useMemo(() => {
        if (images.length === 0) return null;
        if (durationMode === "loop") {
          const cycleDuration = images.length * fixedPerSec;
          if (cycleDuration <= 0) return { img: images[0], localTime: 0, duration: fixedPerSec };
          const loopTime = currentTime % cycleDuration;
          const idx = Math.min(images.length - 1, Math.floor(loopTime / fixedPerSec));
          return {
            img: images[idx],
            localTime: loopTime - (idx * fixedPerSec),
            duration: fixedPerSec
          };
        } else {
          let accum = 0;
          for (let img of images) {
            const d = img.duration || (totalDuration / images.length);
            if (currentTime >= accum && currentTime < accum + d) {
              return { img, localTime: currentTime - accum, duration: d };
            }
            accum += d;
          }
          return { img: images[images.length - 1], localTime: 0, duration: images[images.length - 1].duration || 5 };
        }
      }, [images, currentTime, durationMode, fixedPerSec, totalDuration]);

      // PIP 좌표 계산
      const getPipCoords = useCallback(() => {
        const w = canvasW * (pipSize / 100);
        const h = canvasH * (pipSize / 100);
        let x = 0, y = 0;
        if (freePos) {
          x = freePos.x * canvasW;
          y = freePos.y * canvasH;
        } else {
          switch (pipPos) {
            case "좌하단": x = 24; y = canvasH - h - 24; break;
            case "우상단": x = canvasW - w - 24; y = 24; break;
            case "좌상단": x = 24; y = 24; break;
            case "중앙":   x = (canvasW - w) / 2; y = (canvasH - h) / 2; break;
            default:      x = canvasW - w - 24; y = canvasH - h - 24; break; // 우하단
          }
        }
        return {
          x: Math.max(0, Math.min(canvasW - w, x)),
          y: Math.max(0, Math.min(canvasH - h, y)),
          w, h
        };
      }, [canvasW, canvasH, pipSize, pipPos, freePos]);

      // PIP 비디오/오디오 싱크 맞춤
      useEffect(() => {
        const v = pipVideoRef.current;
        if (!v || !pipMedia || pipMedia.kind !== "video") return;
        if (v.src !== pipMedia.url) { v.src = pipMedia.url; v.load(); }
        
        const inRange = currentTime >= pipStart && currentTime <= pipEnd;
        if (!inRange && !isSwapped) { v.pause(); return; }

        let playHead = currentTime - pipStart;
        const dur = pipMedia.duration || 5;
        playHead = pipLoop ? (playHead % dur) : Math.min(playHead, dur);
        if (Math.abs(v.currentTime - playHead) > 0.3) {
          try { v.currentTime = Math.max(0, playHead); } catch(e) {}
        }
        if (isPlaying) v.play().catch(()=>{}); else v.pause();
      }, [pipMedia, currentTime, isPlaying, pipStart, pipEnd, pipLoop, isSwapped]);

      useEffect(() => {
        const a = audioRef.current;
        if (!a || !audio) return;
        a.volume = audioVol;
        if (Math.abs(a.currentTime - currentTime) > 0.4) {
          try { a.currentTime = Math.min(currentTime, a.duration || currentTime); } catch(e) {}
        }
        if (isPlaying) a.play().catch(()=>{}); else a.pause();
      }, [audio, audioVol, currentTime, isPlaying]);

      // 메인 렌더 함수 (Canvas 그리기)
      const renderFrame = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvasW, canvasH);

        // 렌더 대상: 메인 화면과 서브(PIP) 화면의 미디어를 스왑 상태에 따라 결정
        const renderMainMedia = () => {
          if (isSwapped && pipMedia) {
            // PIP가 메인 화면으로 확대 재생
            if (pipMedia.kind === "video") {
              const v = pipVideoRef.current;
              if (v && v.readyState >= 2) ctx.drawImage(v, 0, 0, canvasW, canvasH);
            } else {
              const img = imgCache.current.get(pipMedia.url);
              if (img && img.complete) ctx.drawImage(img, 0, 0, canvasW, canvasH);
            }
          } else if (currentActiveImage && currentActiveImage.img.url) {
            // 기본: V1 스틸 이미지가 메인 재생
            const img = imgCache.current.get(currentActiveImage.img.url);
            if (img && img.complete) {
              const progress = currentActiveImage.localTime / (currentActiveImage.duration || 5);
              const scale = kenBurns ? 1 + progress * 0.1 : 1.0;
              
              if (bgBlur) {
                ctx.save();
                ctx.filter = "blur(24px) brightness(0.4)";
                ctx.drawImage(img, 0, 0, canvasW, canvasH);
                ctx.restore();
              }
              const aspect = img.naturalWidth / img.naturalHeight;
              const canvasAspect = canvasW / canvasH;
              let dw, dh;
              if (aspect > canvasAspect) { dh = canvasH * scale; dw = dh * aspect; }
              else { dw = canvasW * scale; dh = dw / aspect; }
              ctx.drawImage(img, (canvasW - dw)/2, (canvasH - dh)/2, dw, dh);
            }
          }
        };

        const renderPipSubMedia = () => {
          if (!showPip) return;
          const coords = getPipCoords();
          ctx.save();
          ctx.shadowColor = "rgba(0,0,0,0.7)";
          ctx.shadowBlur = 12;
          ctx.fillStyle = "#000";
          ctx.fillRect(coords.x - 2, coords.y - 2, coords.w + 4, coords.h + 4);
          ctx.shadowBlur = 0;

          if (isSwapped) {
            // 스왑 상태: 작은 PIP 자리에 V1 스틸 이미지가 출력됨
            if (currentActiveImage && currentActiveImage.img.url) {
              const img = imgCache.current.get(currentActiveImage.img.url);
              if (img && img.complete) ctx.drawImage(img, coords.x, coords.y, coords.w, coords.h);
            }
            ctx.fillStyle = "#facc15";
            ctx.fillRect(coords.x, coords.y - 18, 90, 18);
            ctx.fillStyle = "#000";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText("STILL (SWAPPED)", coords.x + 4, coords.y - 5);
          } else if (pipMedia && (currentTime >= pipStart && currentTime <= pipEnd)) {
            // 기본 상태: 작은 PIP 자리에 비디오/스틸 출력
            if (pipMedia.kind === "video") {
              const v = pipVideoRef.current;
              if (v && v.readyState >= 2) ctx.drawImage(v, coords.x, coords.y, coords.w, coords.h);
            } else {
              const img = imgCache.current.get(pipMedia.url);
              if (img && img.complete) ctx.drawImage(img, coords.x, coords.y, coords.w, coords.h);
            }
            ctx.fillStyle = "#a78bfa";
            ctx.fillRect(coords.x, coords.y - 18, 80, 18);
            ctx.fillStyle = "#000";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText("PIP PLAY", coords.x + 4, coords.y - 5);
          }
          ctx.restore();
        };

        renderMainMedia();
        renderPipSubMedia();
      }, [canvasW, canvasH, isSwapped, pipMedia, currentActiveImage, kenBurns, bgBlur, showPip, getPipCoords, currentTime, pipStart, pipEnd]);

      useEffect(() => { renderFrame(); }, [renderFrame]);

      // 메인 재생 루프
      useEffect(() => {
        if (!isPlaying) return;
        let lastTime = performance.now();
        let frameId;
        const tick = (now) => {
          const delta = (now - lastTime) / 1000;
          lastTime = now;
          setCurrentTime(prev => {
            const next = prev + delta;
            if (next >= totalDuration) { setIsPlaying(false); return 0; }
            return next;
          });
          frameId = requestAnimationFrame(tick);
        };
        frameId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frameId);
      }, [isPlaying, totalDuration]);

      // 파일 추가 핸들러
      const handleImageFiles = (files) => {
        if (!files) return;
        const remaining = MAX_IMAGES - images.length;
        if (remaining <= 0) { showToast(`최대 ${MAX_IMAGES}장까지만 추가할 수 있습니다.`); return; }
        const newImgs = Array.from(files).slice(0, remaining).map(file => {
          const url = URL.createObjectURL(file);
          return { id: Math.random().toString(36).substring(2), name: file.name, url, duration: fixedPerSec };
        });
        setImages(prev => [...prev, ...newImgs]);
        showToast(`${newImgs.length}장 이미지가 추가되었습니다.`);
      };

      const handlePipFile = (files) => {
        if (!files || files.length === 0) return;
        const file = files[0];
        const url = URL.createObjectURL(file);
        const isVid = file.type.startsWith("video/");
        if (isVid) {
          const v = document.createElement("video");
          v.src = url;
          v.onloadedmetadata = () => {
            setPipMedia({ id: "pip", kind: "video", name: file.name, url, duration: v.duration });
            setPipEnd(Math.min(totalDuration, v.duration));
          };
        } else {
          setPipMedia({ id: "pip", kind: "image", name: file.name, url, duration: 10 });
        }
        showToast(`PIP 미디어 등록 완료: ${file.name}`);
      };

      const handleAudioFile = (files) => {
        if (!files || files.length === 0) return;
        const file = files[0];
        const url = URL.createObjectURL(file);
        const a = new Audio(url);
        a.onloadedmetadata = () => {
          setAudio({ name: file.name, url, duration: a.duration });
          showToast(`오디오 장착: ${file.name} (${a.duration.toFixed(1)}초)`);
        };
      };

      // 드래그 앤 드롭 순서 변경 핸들러
      const onDragStart = (idx) => { dragItemIdx.current = idx; };
      const onDragOver = (e) => { e.preventDefault(); };
      const onDrop = (targetIdx) => {
        if (dragItemIdx.current === null || dragItemIdx.current === targetIdx) return;
        const copy = [...images];
        const [dragged] = copy.splice(dragItemIdx.current, 1);
        copy.splice(targetIdx, 0, dragged);
        dragItemIdx.current = null;
        setImages(copy);
        showToast("이미지 순서가 변경되었습니다.");
      };

      return (
        <div className="h-screen flex flex-col bg-[#0f0f0f] text-[#e5e5e5] text-[12px]">
          {/* 비디오/오디오 숨김 태그 */}
          <video ref={pipVideoRef} muted playsInline className="hidden" />
          <audio ref={audioRef} src={audio?.url} preload="auto" className="hidden" />

          {/* 헤더 */}
          <header className="h-[52px] shrink-0 flex items-center justify-between px-3 bg-[#1a1a1a] border-b border-[#2a2a2a]">
            <div className="flex items-center gap-3">
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="w-7 h-7 rounded bg-[#2a2a2a] border border-[#333] flex items-center justify-center hover:bg-[#333]">
                {sidebarOpen ? "←" : "→"}
              </button>
              <div className="px-2 py-0.5 rounded bg-[#facc15] text-black font-black text-[11px]">TP</div>
              <span className="font-bold text-[13px] tracking-tight">타짱 프리미어</span>
              <span className="px-2 py-0.5 rounded bg-[#10b981]/20 text-[#10b981] text-[10px] font-bold border border-[#10b981]/30">v1.0 Pro</span>
              <span className="text-[#666] text-[11px] hidden md:inline">• 오디오 시간 자동 균등배분 & 스왑 PIP 지원</span>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={() => setIsVertical(!isVertical)} className={`h-7 px-3 rounded border text-[11px] font-bold transition ${isVertical ? "bg-[#facc15] text-black border-[#facc15]" : "bg-[#252525] border-[#3a3a3a] text-[#aaa]"}`}>
                {isVertical ? "9:16 쇼츠" : "16:9 와이드"}
              </button>
              <button onClick={() => setIsSwapped(!isSwapped)} className="h-7 px-3 rounded bg-[#a78bfa]/20 border border-[#a78bfa]/40 text-[#c4b5fd] font-bold hover:bg-[#a78bfa]/30 text-[11px]" title="화면 더블클릭과 동일 기능">
                🔄 메인 ↔ PIP 화면 맞교환 ({isSwapped ? "스왑 ON" : "스왑 OFF"})
              </button>
            </div>
          </header>

          {/* 알림 토스트 */}
          {toastMsg && (
            <div className="bg-[#10b981]/20 border-b border-[#10b981]/30 text-[#10b981] text-[11px] py-1 px-4 flex items-center gap-2">
              <span>✓</span><span>{toastMsg}</span>
            </div>
          )}

          {/* 메인 작업 영역 */}
          <div className="flex-1 flex min-h-0 relative">
            {/* 좌측 컨트롤 사이드바 */}
            <aside className={`shrink-0 bg-[#171717] border-r border-[#2a2a2a] flex flex-col transition-all duration-75 overflow-hidden ${sidebarOpen ? "" : "w-0"}`} style={{ width: sidebarOpen ? sidebarWidth : 0 }}>
              <div className="h-[36px] shrink-0 flex items-center justify-between px-3 bg-[#1e1e1e] border-b border-[#2a2a2a]">
                <span className="text-[11px] font-bold text-[#aaa]">편집 설정 패널</span>
                <span className="text-[9px] text-[#555]">{sidebarWidth}px</span>
              </div>

              <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-3">
                {/* 1. 이미지 트랙 관리 (드래그다운 순서 변경 & 시간 자동화) */}
                <div className="rounded-xl bg-[#1e1e1e] border border-[#2a2a2a] p-2.5">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="text-[12px] font-bold text-[#fbbf24]">1. 이미지 트랙 ({images.length}/{MAX_IMAGES})</h3>
                    <label className="h-6 px-2.5 rounded bg-[#fbbf24] text-black font-bold flex items-center cursor-pointer hover:bg-[#eab308] text-[10px]">
                      + 사진 추가
                      <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => { handleImageFiles(e.target.files); e.target.value = ""; }} />
                    </label>
                  </div>

                  {/* 시간 자동화 모드 스위처 */}
                  <div className="bg-[#151310] border border-[#fbbf24]/20 rounded-lg p-2 mb-2">
                    <div className="text-[10px] text-[#888] mb-1 font-bold">이미지 노출 시간 방식</div>
                    <div className="grid grid-cols-2 gap-1 mb-2">
                      <button onClick={() => setDurationMode("fit")} className={`py-1 rounded text-[10px] font-bold border ${durationMode === "fit" ? "bg-[#fbbf24] text-black border-[#fbbf24]" : "bg-[#222] border-[#333] text-[#777]"}`}>
                        전체길이 균등분배
                      </button>
                      <button onClick={() => setDurationMode("loop")} className={`py-1 rounded text-[10px] font-bold border ${durationMode === "loop" ? "bg-[#fbbf24] text-black border-[#fbbf24]" : "bg-[#222] border-[#333] text-[#777]"}`}>
                        고정초 무한루프
                      </button>
                    </div>

                    {durationMode === "fit" ? (
                      <div className="text-[10px] text-[#aaa]">
                        총 <span className="text-[#fbbf24] font-bold">{totalDuration.toFixed(1)}초</span> ÷ {images.length}장 = 장당 <span className="text-[#10b981] font-bold">{(totalDuration / Math.max(1, images.length)).toFixed(1)}초</span> 노출
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] text-[#888]">각 사진당</span>
                        <input type="range" min="1" max="15" step="0.5" value={fixedPerSec} onChange={(e) => setFixedPerSec(parseFloat(e.target.value))} className="flex-1 accent-[#fbbf24] h-1" />
                        <span className="text-[10px] font-mono text-[#fbbf24]">{fixedPerSec.toFixed(1)}초 반복</span>
                      </div>
                    )}
                  </div>

                  {/* 드래그 앤 드롭 썸네일 그리드 */}
                  <div className="text-[9px] text-[#666] mb-1">💡 마우스로 사진을 끌어서(Drag) 순서를 바꿀 수 있습니다.</div>
                  <div className="grid grid-cols-3 gap-1.5 max-h-[190px] overflow-auto pr-1">
                    {images.map((img, idx) => (
                      <div
                        key={img.id}
                        draggable
                        onDragStart={() => onDragStart(idx)}
                        onDragOver={onDragOver}
                        onDrop={() => onDrop(idx)}
                        className="group relative rounded bg-[#111] border border-[#333] aspect-[4/3] overflow-hidden cursor-move hover:border-[#fbbf24] transition"
                      >
                        {img.url ? <img src={img.url} className="w-full h-full object-cover" /> : <div className="w-full h-full bg-[#222]" />}
                        <div className="absolute top-1 left-1 px-1 rounded bg-black/70 text-[8px] text-white font-mono">{idx + 1}</div>
                        <div className="absolute bottom-1 left-1 px-1 rounded bg-[#fbbf24] text-black text-[7px] font-bold">
                          {(img.duration || fixedPerSec).toFixed(1)}s
                        </div>
                        <button
                          onClick={() => setImages(prev => prev.filter(item => item.id !== img.id))}
                          className="absolute top-1 right-1 w-4 h-4 rounded-full bg-[#ef4444] text-white text-[8px] opacity-0 group-hover:opacity-100 flex items-center justify-center"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 2. PIP 비디오/스틸 설정 */}
                <div className="rounded-xl bg-[#1a1625] border border-[#a78bfa]/20 p-2.5">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-[11px] font-bold text-[#c4b5fd]">2. PIP 미디어 (동영상 / 스틸)</span>
                    <label className="h-6 px-2 rounded bg-[#231e33] border border-[#a78bfa]/40 text-[#c4b5fd] text-[10px] flex items-center cursor-pointer hover:bg-[#2e2644]">
                      + PIP 파일
                      <input type="file" accept="video/*,image/*" className="hidden" onChange={(e) => { handlePipFile(e.target.files); e.target.value = ""; }} />
                    </label>
                  </div>

                  {pipMedia ? (
                    <div className="rounded bg-[#231e33] border border-[#a78bfa]/30 p-2 flex items-center justify-between">
                      <div className="truncate flex-1">
                        <div className="text-[11px] text-[#e5e5e5] truncate">{pipMedia.name}</div>
                        <div className="text-[9px] text-[#a78bfa]">{pipMedia.kind.toUpperCase()} • {(pipMedia.duration || 0).toFixed(1)}s</div>
                      </div>
                      <button onClick={() => setPipMedia(null)} className="w-5 h-5 rounded bg-[#2a2a2a] text-[10px]">✕</button>
                    </div>
                  ) : (
                    <div className="text-[10px] text-[#6d5aa8] py-2 text-center border border-dashed border-[#a78bfa]/30 rounded">
                      PIP 동영상/사진 없음 (등록 시 화면 우하단 표시)
                    </div>
                  )}

                  <div className="mt-2 grid grid-cols-2 gap-1.5">
                    <div className="bg-[#18151f] border border-[#2a2a2a] rounded p-1.5">
                      <span className="text-[9px] text-[#888]">위치</span>
                      <select value={pipPos} onChange={(e) => { setPipPos(e.target.value); setFreePos(null); }} className="w-full h-6 rounded bg-[#222] border border-[#333] text-[10px] mt-0.5">
                        <option>우하단</option><option>좌하단</option><option>우상단</option><option>좌상단</option><option>중앙</option>
                      </select>
                    </div>
                    <div className="bg-[#18151f] border border-[#2a2a2a] rounded p-1.5">
                      <span className="text-[9px] text-[#888]">크기</span>
                      <select value={pipSize} onChange={(e) => setPipSize(parseInt(e.target.value))} className="w-full h-6 rounded bg-[#222] border border-[#333] text-[10px] mt-0.5">
                        <option value={20}>20%</option><option value={25}>25%</option><option value={30}>30%</option><option value={35}>35%</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* 3. 배경 오디오(MP3) 설정 */}
                <div className="rounded-xl bg-[#0f1a15] border border-[#10b981]/30 p-2.5">
                  <div className="flex justify-between items-center mb-1.5">
                    <span className="text-[11px] font-bold text-[#6bb89a]">3. 배경 오디오 (MP3 / WAV)</span>
                    <label className="h-6 px-2 rounded bg-[#123123] border border-[#10b981]/40 text-[#10b981] text-[10px] flex items-center cursor-pointer hover:bg-[#1a4430]">
                      + 오디오 선택
                      <input type="file" accept="audio/*" className="hidden" onChange={(e) => { handleAudioFile(e.target.files); e.target.value = ""; }} />
                    </label>
                  </div>
                  {audio ? (
                    <div className="flex items-center justify-between text-[11px] text-[#6bb89a]">
                      <span className="truncate">{audio.name} ({audio.duration.toFixed(1)}s)</span>
                      <button onClick={() => setAudio(null)} className="w-5 h-5 rounded bg-[#222] text-[10px]">✕</button>
                    </div>
                  ) : (
                    <div className="text-[10px] text-[#6bb89a]/50">오디오 파일이 등록되면 전체 러닝타임이 자동으로 동기화됩니다.</div>
                  )}
                </div>
              </div>
            </aside>

            {/* 프리뷰 & 하단 타임라인 영역 */}
            <section className="flex-1 flex flex-col min-w-0 bg-[#0f0f0f]">
              {/* 모니터 상단 바 */}
              <div className="h-[40px] shrink-0 flex items-center justify-between px-3 bg-[#181818] border-b border-[#2a2a2a]">
                <div className="flex items-center gap-2">
                  <span className="px-1.5 py-0.5 rounded bg-[#333] text-[#aaa] text-[9px] font-bold">PREVIEW</span>
                  <span className="font-mono text-[#facc15] font-bold">{currentTime.toFixed(2)}s / {totalDuration.toFixed(1)}s</span>
                  {isSwapped && <span className="px-1.5 py-0.5 rounded bg-[#a78bfa] text-black font-bold text-[9px]">SWAPPED MODE</span>}
                </div>
                <div className="text-[10px] text-[#777]">캔버스 화면을 더블클릭하면 PIP와 메인 화면이 맞교환됩니다.</div>
              </div>

              {/* 캔버스 프리뷰 모니터 */}
              <div
                className="flex-1 bg-black flex items-center justify-center relative overflow-hidden cursor-pointer"
                onDoubleClick={() => setIsSwapped(!isSwapped)}
                title="더블클릭: 메인과 PIP 화면 맞바꾸기"
              >
                <canvas
                  ref={canvasRef}
                  width={canvasW}
                  height={canvasH}
                  className="max-w-full max-h-full object-contain"
                  style={{ aspectRatio: isVertical ? "9/16" : "16/9" }}
                />
              </div>

              {/* 플레이어 조작 바 */}
              <div className="h-[48px] shrink-0 flex items-center gap-3 px-4 bg-[#1a1a1a] border-y border-[#2a2a2a]">
                <button onClick={() => setIsPlaying(!isPlaying)} className="h-7 px-4 rounded-full bg-white text-black font-bold hover:bg-[#ddd]">
                  {isPlaying ? "⏸ 정지" : "▶ 재생"}
                </button>
                <input
                  type="range"
                  min="0"
                  max={totalDuration}
                  step="0.05"
                  value={currentTime}
                  onChange={(e) => setCurrentTime(parseFloat(e.target.value))}
                  className="flex-1 accent-[#facc15] h-1"
                />
                <span className="font-mono text-[11px] text-[#aaa] w-12 text-right">{currentTime.toFixed(1)}s</span>
              </div>

              {/* 하단 통합 타임라인 트랙 */}
              <div className="h-[140px] shrink-0 bg-[#121212] p-2 flex flex-col gap-1.5 border-t border-[#2a2a2a]">
                {/* V1 이미지 트랙 */}
                <div className="flex-1 bg-[#1a1a1a] rounded border border-[#2a2a2a] p-1 flex items-center gap-1 overflow-x-auto">
                  <div className="px-1 text-[9px] font-bold text-[#fbbf24] shrink-0">V1 STILL</div>
                  {images.map((img, idx) => (
                    <div
                      key={img.id}
                      className={`h-full min-w-[70px] rounded border p-1 flex flex-col justify-between overflow-hidden relative ${currentActiveImage?.img.id === img.id ? "border-[#facc15] bg-[#2a2415]" : "border-[#333] bg-[#1f1f1f]"}`}
                    >
                      {img.url && <img src={img.url} className="absolute inset-0 w-full h-full object-cover opacity-20" />}
                      <span className="text-[8px] font-bold relative z-10">{idx + 1}. {img.name}</span>
                      <span className="text-[7px] text-[#fbbf24] font-mono relative z-10">{(img.duration || fixedPerSec).toFixed(1)}s</span>
                    </div>
                  ))}
                </div>

                {/* V2 PIP 트랙 */}
                <div className="h-[36px] bg-[#1a1620] rounded border border-[#a78bfa]/20 p-1 flex items-center px-2">
                  <span className="text-[9px] font-bold text-[#c4b5fd] mr-2">V2 PIP</span>
                  <div className="flex-1 h-full bg-[#231e33] rounded border border-[#a78bfa]/40 flex items-center px-2 text-[10px] text-[#a78bfa]">
                    {pipMedia ? `${pipMedia.name} (${pipMedia.kind}) • ${isSwapped ? "현재 대화면 송출 중" : "우측 하단 PIP 송출 중"}` : "등록된 PIP 미디어 없음"}
                  </div>
                </div>

                {/* 오디오 트랙 */}
                <div className="h-[28px] bg-[#0f1a15] rounded border border-[#10b981]/20 p-1 flex items-center px-2 text-[9px] text-[#6bb89a]">
                  <span className="font-bold mr-2">AUDIO</span>
                  <span>{audio ? `${audio.name} (${audio.duration.toFixed(1)}초 동기화됨)` : "배경 음악 없음"}</span>
                </div>
              </div>
            </section>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TazzangPremier />);
  </script>
</body>
</html>
